name: Release

on:
  push:
    tags: ["v*"] # 当推送 v1.0.0 等标签时触发

env:
  # 解决 Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 某个平台失败时不停止其他平台的构建
      matrix:
        include:
          # Linux (使用 musl 实现完全静态链接，兼容所有发行版)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: tui-mines-linux-amd64
            use_cross: true
          # macOS Intel 架构
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-mines-macos-intel
          # macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-mines-macos-arm64
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-mines-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Cross (Linux only)
        if: matrix.use_cross
        run: |
          # 直接下载预编译二进制，避免 cargo install 404 或超时
          curl -L https://github.com | tar xz
          sudo mv cross /usr/local/bin/

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare and Strip Binary
        shell: bash
        run: |
          # 定义产物原始路径
          BIN_DIR="target/${{ matrix.target }}/release"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Windows 不支持 strip 命令，直接重命名
            mv "$BIN_DIR/tui-mines.exe" "./${{ matrix.artifact_name }}"
          else
            # Unix 系进行 strip 进一步压缩体积
            STRIP_PATH="$BIN_DIR/tui-mines"
            strip "$STRIP_PATH" || echo "Strip failed, skipping..."
            mv "$STRIP_PATH" "./${{ matrix.artifact_name }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # 使用 v2 版本适配 Node 20+
        with:
          files: ${{ matrix.artifact_name }}
          # 自动生成版本说明
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
