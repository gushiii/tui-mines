name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (静态链接 musl)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: tui-mines-linux-amd64
            use_cross: true
          # macOS (Intel + Apple Silicon 通用版)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tui-mines-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tui-mines-macos-arm64
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tui-mines-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 针对 Linux musl 的特殊处理：使用 cross 工具确保环境一致
      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare Binary
        run: |
          cd target/${{ matrix.target }}/release
          # 重命名方便用户辨识
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv tui-mines.exe ${{ matrix.artifact_name }}
          else
            strip tui-mines # 进一步剔除符号
            mv tui-mines ${{ matrix.artifact_name }}
          fi
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
